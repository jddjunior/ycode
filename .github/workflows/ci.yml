name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bounce_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx astro check
      - name: Tests (embedded Postgres)
        run: npm test
      - name: Integration tests (real Postgres, production driver)
        run: npx vitest run tests/booking.integration.test.ts
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bounce_test
          DATABASE_SSL: disable
      - name: Build
        run: npx astro build
